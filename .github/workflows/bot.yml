      - name: Restore seen news
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-news-${{ github.run_id }}
          restore-keys: |
            seen-news-

      - name: Initialize news history
        run: |
          if [ ! -f seen.json ]; then
            echo "[]" > seen.json
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
